apiVersion: kdc.rolphr.dev/v1alpha1
kind: Resource
metadata:
  name: kdcr-76301769af2547031943fda3d37bf4a5
  namespace: kdc-example-aws
spec:
  references:
    network:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: VPC
      name: kdc-aws-network
  lifecycle:
    targetReadiness:
      mode: Predicates
      observedGeneration: IfPresent
      checks:
        - condition:
            type: ACK.ResourceSynced
            status: 'True'
    reconcileInterval: 1m
    deletionPolicy: abandon
    dependencies:
      - name: network_ready
        reference: network
        readiness:
          observedGeneration: IfPresent
          checks:
            - condition:
                type: ACK.ResourceSynced
                status: 'True'
  target:
    apiVersion: ec2.services.k8s.aws/v1alpha1
    kind: SecurityGroup
    metadata:
      name: kdc-aws-vm-firewall
    spec:
      name: kdc-example-vm
      description: VM egress to PostgreSQL database subnets only
      vpcID: '{{ .refs.network.status.vpcID }}'
      ingressRules: []
      egressRules:
        - ipProtocol: tcp
          fromPort: 5432
          toPort: 5432
          ipRanges:
            - cidrIP: 10.30.2.0/24
            - cidrIP: 10.30.3.0/24
---
apiVersion: kdc.rolphr.dev/v1alpha1
kind: Resource
metadata:
  name: kdcr-124733d6d9f6b07760dbe2ecfa40f7e7
  namespace: kdc-example-aws
spec:
  references:
    network:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: VPC
      name: kdc-aws-network
    vm:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: Instance
      name: kdc-aws-vm
  lifecycle:
    targetReadiness:
      mode: Predicates
      observedGeneration: IfPresent
      checks:
        - condition:
            type: ACK.ResourceSynced
            status: 'True'
    reconcileInterval: 1m
    deletionPolicy: abandon
    dependencies:
      - name: network_ready
        reference: network
        readiness:
          observedGeneration: IfPresent
          checks:
            - condition:
                type: ACK.ResourceSynced
                status: 'True'
      - name: vm_ready
        reference: vm
        readiness:
          observedGeneration: IfPresent
          checks:
            - condition:
                type: ACK.ResourceSynced
                status: 'True'
            - field:
                path: /status/state/name
                equals: running
  target:
    apiVersion: ec2.services.k8s.aws/v1alpha1
    kind: SecurityGroup
    metadata:
      name: kdc-aws-allow-vm-to-database
    spec:
      name: kdc-example-database
      description: Allow PostgreSQL from the fixed VM private IP only
      vpcID: '{{ .refs.network.status.vpcID }}'
      ingressRules:
        - ipProtocol: tcp
          fromPort: 5432
          toPort: 5432
          ipRanges:
            - cidrIP: '{{ .refs.vm.spec.privateIPAddress }}/32'
      egressRules: []
