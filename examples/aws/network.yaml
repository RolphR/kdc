# kdc design example. See ../../docs/examples.md for prerequisites and provider details.
apiVersion: kdc.rolphr.dev/v1alpha1
kind: Resource
metadata:
  name: kdcr-472981c9ad918c796cfb4570aa75d81b
  namespace: kdc-example-aws
spec:
  lifecycle:
    targetReadiness:
      mode: Predicates
      observedGeneration: IfPresent
      checks:
        - condition:
            type: ACK.ResourceSynced
            status: 'True'
    reconcileInterval: 1m
    deletionPolicy: abandon
  target:
    apiVersion: ec2.services.k8s.aws/v1alpha1
    kind: VPC
    metadata:
      name: kdc-aws-network
    spec:
      cidrBlocks:
        - 10.30.0.0/16
      enableDNSHostnames: true
      enableDNSSupport: true
---
apiVersion: kdc.rolphr.dev/v1alpha1
kind: Resource
metadata:
  name: kdcr-1bff18a3573e160549f403e81bd331c5
  namespace: kdc-example-aws
spec:
  references:
    network:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: VPC
      name: kdc-aws-network
  lifecycle:
    targetReadiness:
      mode: Predicates
      observedGeneration: IfPresent
      checks:
        - condition:
            type: ACK.ResourceSynced
            status: 'True'
    reconcileInterval: 1m
    deletionPolicy: abandon
    dependencies:
      - name: network_ready
        reference: network
        readiness:
          observedGeneration: IfPresent
          checks:
            - condition:
                type: ACK.ResourceSynced
                status: 'True'
  target:
    apiVersion: ec2.services.k8s.aws/v1alpha1
    kind: Subnet
    metadata:
      name: kdc-aws-vm-subnet
    spec:
      vpcID: '{{ .refs.network.status.vpcID }}'
      cidrBlock: 10.30.1.0/24
      availabilityZone: eu-west-1a
      mapPublicIPOnLaunch: false
---
