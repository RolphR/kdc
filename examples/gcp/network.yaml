# kdc design example. See ../../docs/examples.md for prerequisites and provider details.
apiVersion: kdc.rolphr.dev/v1alpha1
kind: Resource
metadata:
  name: kdcr-c3cbe246b4f01dd45a684a4050e5102b
  namespace: kdc-example-gcp
spec:
  references:
    settings:
      apiVersion: v1
      kind: ConfigMap
      name: example-settings
  lifecycle:
    targetReadiness:
      mode: Predicates
      observedGeneration: Require
      checks:
        - condition:
            type: Ready
            status: 'True'
    reconcileInterval: 1m
    deletionPolicy: abandon
  target:
    apiVersion: compute.cnrm.cloud.google.com/v1beta1
    kind: ComputeNetwork
    metadata:
      name: kdc-gcp-network
      annotations:
        cnrm.cloud.google.com/project-id: '{{ .refs.settings.data.projectId }}'
    spec:
      autoCreateSubnetworks: false
      routingMode: REGIONAL
---
apiVersion: kdc.rolphr.dev/v1alpha1
kind: Resource
metadata:
  name: kdcr-2849fef50bda90dfff4565b98c0b840b
  namespace: kdc-example-gcp
spec:
  references:
    network:
      apiVersion: compute.cnrm.cloud.google.com/v1beta1
      kind: ComputeNetwork
      name: kdc-gcp-network
    settings:
      apiVersion: v1
      kind: ConfigMap
      name: example-settings
  lifecycle:
    targetReadiness:
      mode: Predicates
      observedGeneration: Require
      checks:
        - condition:
            type: Ready
            status: 'True'
    reconcileInterval: 1m
    deletionPolicy: abandon
    dependencies:
      - name: network_ready
        reference: network
        readiness:
          observedGeneration: Require
          checks:
            - condition:
                type: Ready
                status: 'True'
  target:
    apiVersion: compute.cnrm.cloud.google.com/v1beta1
    kind: ComputeSubnetwork
    metadata:
      name: kdc-gcp-vm-subnet
      annotations:
        cnrm.cloud.google.com/project-id: '{{ .refs.settings.data.projectId }}'
    spec:
      region: europe-west4
      ipCidrRange: 10.20.1.0/24
      networkRef:
        external: '{{ .refs.network.status.selfLink }}'
      privateIpGoogleAccess: true
---
