apiVersion: kdc.rolphr.dev/v1alpha1
kind: Resource
metadata:
  name: kdcr-b3fba26e50eaf0b96020b925fb70acfe
  namespace: kdc-example-azure
spec:
  references:
    network:
      apiVersion: network.azure.com/v1api20201101
      kind: VirtualNetwork
      name: kdc-azure-network
    firewall:
      apiVersion: network.azure.com/v1api20201101
      kind: NetworkSecurityGroup
      name: kdc-azure-database-firewall
    allow:
      apiVersion: network.azure.com/v1api20201101
      kind: NetworkSecurityGroupsSecurityRule
      name: kdc-azure-allow-vm-to-database
    internal:
      apiVersion: network.azure.com/v1api20201101
      kind: NetworkSecurityGroupsSecurityRule
      name: kdc-azure-allow-database-internal
    deny:
      apiVersion: network.azure.com/v1api20201101
      kind: NetworkSecurityGroupsSecurityRule
      name: kdc-azure-deny-other-database-access
  lifecycle:
    targetReadiness:
      mode: Predicates
      observedGeneration: Require
      checks:
        - condition:
            type: Ready
            status: 'True'
    reconcileInterval: 1m
    deletionPolicy: abandon
    dependencies:
      - name: network_ready
        reference: network
        readiness:
          observedGeneration: Require
          checks:
            - condition:
                type: Ready
                status: 'True'
      - name: firewall_ready
        reference: firewall
        readiness:
          observedGeneration: Require
          checks:
            - condition:
                type: Ready
                status: 'True'
      - name: allow_ready
        reference: allow
        readiness:
          observedGeneration: Require
          checks:
            - condition:
                type: Ready
                status: 'True'
      - name: internal_ready
        reference: internal
        readiness:
          observedGeneration: Require
          checks:
            - condition:
                type: Ready
                status: 'True'
      - name: deny_ready
        reference: deny
        readiness:
          observedGeneration: Require
          checks:
            - condition:
                type: Ready
                status: 'True'
  target:
    apiVersion: network.azure.com/v1api20201101
    kind: VirtualNetworksSubnet
    metadata:
      name: kdc-azure-database-subnet
    spec:
      owner:
        name: kdc-azure-network
      addressPrefix: 10.40.2.0/24
      delegations:
        - name: postgresql
          serviceName: Microsoft.DBforPostgreSQL/flexibleServers
      networkSecurityGroup:
        reference:
          armId: '{{ .refs.firewall.status.id }}'
      serviceEndpoints:
        - service: Microsoft.Storage
          locations:
            - westeurope
